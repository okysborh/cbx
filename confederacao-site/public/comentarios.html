<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comentários — Confederação Cannabica Xamaniáca</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="comentarios">
  <div class="layout">
    <aside id="sidebar"></aside>
    <div class="main-col">
      <div id="banner"></div>
      <main class="content">
        <h2 class="page-title">💬 Mural de Comentários</h2>
        <div id="comment-list" class="comment-list"></div>
        <form id="form-comment" class="comment-form">
          <textarea name="text" rows="3" maxlength="1000" placeholder="Escreva um comentário…" required></textarea>
          <button class="btn" type="submit">Comentar</button>
        </form>
      </main>
    </div>
  </div>
  <script src="/js/features.js"></script>
  <script src="/js/page-comentarios.js"></script>
  <script src="/js/layout.js"></script>
</body>
</html>
